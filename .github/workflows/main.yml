name: Bitcoin Underground Autonomous Bot

on:
  schedule:
    - cron: '0 * * * *' # كيشعل راسه كل ساعة أوتوماتيكياً
  workflow_dispatch: # كيعطيك الحق تشعلو يدوياً فوق ما بغيتي من GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Autonomous Bitcoin Script
        env:
          BTC_PRIVATE_KEY: ${{ secrets.BTC_PRIVATE_KEY }}
        run: |
          python bot.py
